name: Windows Build Spike

# Manual-only trial build to confirm the pinned `gpui` revision compiles on
# `windows-latest`. The required Windows leg in `ci.yml` is the authoritative
# automated check; this manual workflow remains useful for verbose diagnostics.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --package dtrpg-desktop --target x86_64-pc-windows-msvc --verbose

      - name: Test
        run: cargo test --release --workspace --target x86_64-pc-windows-msvc --verbose
