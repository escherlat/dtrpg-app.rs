[workspace]
default-members = [
    "crates/dtrpg-core",
    "crates/dtrpg-ui",
    "crates/dtrpg-desktop",
    "crates/dtrpg-mcp",
]
members = [
    "crates/dtrpg-core",
    "crates/dtrpg-ui",
    "crates/dtrpg-desktop",
    "crates/dtrpg-mcp",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
description = "DriveThruRPG desktop frontend in Rust"
license = "MIT"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
dtrpg-sdk = "1.2"
schemars = "1.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1"
dirs = "7"
rfd = "0.17"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
thiserror = "2"
tracing = "0.1"
dtrpg-core = { path = "crates/dtrpg-core" }
dtrpg-ui = { path = "crates/dtrpg-ui" }
tokio = { version = "1", features = ["rt-multi-thread"] }
# gpui-kit forks zed-industries/zed's gpui under its own package family
# (gpui-pre, gpui-pre-platform, gpui-pre-macros) — pinned to the exact
# version gpui-kit 0.7.3 itself depends on, so our Context/Window/App/Global
# types are the *same* types gpui-kit's widgets use, not merely
# structurally similar ones. See docs/adr/0001-migrate-to-gpui-kit.md.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "wayland", "x11"] }
gpui-kit = "0.7"
cocoa = "=0.27.0"
cocoa-foundation = "=0.2.0"
core-foundation = "=0.10.0"
core-foundation-sys = "0.8.6"
core-video = { version = "0.6.1", features = ["metal"] }
metal = "0.33"
md5 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rust-i18n = "4"
chrono = "0.4"
base64 = "0.22"
sys-locale = "0.3"
open = "5"
rust-embed = "8.11"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.49"
tar = "0.4.46"
flate2 = "1.1.10"
bzip2 = "0.6.1"
xz2 = "0.1.7"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
