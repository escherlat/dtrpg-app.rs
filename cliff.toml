[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits -%}
- {{ commit.message | upper_first }}{% if commit.breaking %} **[BREAKING]**{% endif %}
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Map commit types to changelog groups, and set which types count toward a
# "breaking"/major bump.
commit_parsers = [
  # Excluded from the changelog entirely. `scope = "..."` in a commit_parsers
  # entry does NOT filter by the commit's scope -- it *assigns* one, the same
  # way `group = "..."` does. Scope-based exclusion has to match the
  # "type(scope): ..." prefix in `message` instead. These rules run before the
  # type rules below, so e.g. `fix(ci): ...` is skipped rather than landing in
  # "Fixed" -- CI/release tooling is internal maintenance, not user-facing.
  { message = "^\\w+\\(ci\\)", skip = true },
  { message = "^\\w+\\(internal\\)", skip = true },
  { message = "^\\w+\\(dev\\)", skip = true },
  { message = "^\\w+\\(openspec\\)", skip = true },
  # No "(release)" scope-skip here (unlike the Knot/Fernrohr-App template this
  # was copied from): a `fix(release): ...` can be a genuine user-facing bug
  # fix in release-relevant application code (e.g. the Sentry client init
  # path), not just release-tooling/CI maintenance -- blanket-skipping the
  # scope silently dropped exactly that kind of commit from both the
  # changelog and the version bump.
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },

  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc", group = "Documentation" },
]

# Exclude specific scopes regardless of type, e.g. internal tooling
# that isn't user-facing.
filter_commits = true

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
# No `initial_tag` fallback needed: real tag history already exists (0.0.1
# through 0.1.2, unprefixed - the old workflow's `tagFormat: "${version}"`).
# git-cliff's default tag matching accepts an optional leading "v", so it
# finds `0.1.2` as the latest tag without a custom `tag_pattern`. Going
# forward, tags gain a "v" prefix (`v0.1.3`, ...): `rust-tag-release.yaml`
# hardcodes that format and isn't configurable per-caller, so adopting it
# means the tag scheme changes starting with the first release this pipeline
# cuts.
