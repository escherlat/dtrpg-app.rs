[package]
name = "dtrpg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
dtrpg-sdk.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
sentry = { workspace = true, optional = true }
sentry-tracing = { workspace = true, optional = true }
serde = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
keyring = { workspace = true }
md5 = { workspace = true }
base64 = { workspace = true }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
reqwest = { workspace = true }
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled"] }
tar.workspace = true
flate2.workspace = true
bzip2.workspace = true
xz2.workspace = true
zip.workspace = true
lopdf.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
xattr = { workspace = true }
plist = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[features]
test-fixtures = []
# Enables Sentry crash/error reporting. Compiled in only for CI-built release
# artifacts; source builds (`cargo build`/`cargo test`/`cargo run` with no
# explicit feature flags) never pull in the Sentry dependency.
sentry = ["dep:sentry", "dep:sentry-tracing"]
